[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genio"
version = "0.1.0"
description = "Framework desacoplado para evaluar candidatos en espacios de busqueda."
requires-python = ">=3.10"
dependencies = [
    "numpy<2",
    "pymoo>=0.6.2,<0.7",
]

[project.optional-dependencies]
image_pipeline = ["opencv-python-headless>=4.8,<4.12"]
xheep = ["opencv-python-headless>=4.8,<4.12"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["genio*", "genio_use_cases*"]

[tool.setuptools.package-data]
genio = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not hls_integration'"
markers = [
    "hls_integration: requires a local Vitis HLS installation",
    "slow: long-running integration test",
]

[tool.mypy]
python_version = "3.10"
files = ["src/genio", "src/genio_use_cases"]
check_untyped_defs = true
ignore_missing_imports = true
