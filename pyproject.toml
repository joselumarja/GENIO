[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genio"
version = "0.1.0"
description = "Framework desacoplado para evaluar candidatos en espacios de busqueda."
requires-python = ">=3.10"
dependencies = [
    "numpy<2",
    "pymoo>=0.6.2,<0.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not hls_integration'"
markers = [
    "hls_integration: requires a local Vitis HLS installation",
    "slow: long-running integration test",
]
